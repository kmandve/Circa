[project]
name = "circa"
version = "0.1.0"
description = "A personal circadian phase engine: Fitbit Air -> Google Health API -> Google Calendar"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # ingestion / auth
    "httpx>=0.27",
    "cryptography>=43.0",
    # storage
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # scheduling + config + cli
    "apscheduler>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.9",
    "structlog>=24.4",
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Phase 2+ modelling stack. Kept optional so Phase 0 (collection) installs fast
# and can run on a 1GB e2-micro without pulling the full scientific stack.
science = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "circadian>=1.0.3",     # MIT - Jewett99/Forger99/Hilaire07/Hannay19 oscillators
    "filterpy==1.4.5",      # MIT - particle filter utilities (pinned: low upstream activity)
    "pycircstat2>=0.1.5",   # MIT - circular hypothesis tests
    "CosinorPy>=3.1",       # MIT - cosinor rhythm fitting
    "astral==3.2",          # Apache-2.0 - sunrise/sunset/solar elevation
    "pvlib>=0.11",          # BSD-3 - NREL SPA clear-sky GHI for the light proxy
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "freezegun>=1.5",
    "hypothesis>=6.112",
]

[project.scripts]
circa = "circa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["circa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is function calls in argument defaults.
"circa/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
